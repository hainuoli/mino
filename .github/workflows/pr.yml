name: Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check format
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8

          fail() {
            echo "::error::$1"
            echo 'Use a supported Gitmoji, one space, and an imperative sentence:'
            echo '  ✨ Add HTTP routing foundation'
            exit 1
          }

          if (( ${#TITLE} > 72 )); then
            fail 'The title must be 72 characters or fewer.'
          fi

          case "$TITLE" in
            "✨ "*|"🐛 "*|"💥 "*|"🔒️ "*|"🔒 "*|\
            "📝 "*|"✏️ "*|"✏ "*|"🌐 "*|\
            "⬆️ "*|"⬆ "*|"⬇️ "*|"⬇ "*|"♻️ "*|"♻ "*|\
            "🎨 "*|"⚡️ "*|"⚡ "*|"🔥 "*|\
            "👷 "*|"🔧 "*|"🔨 "*|"🚨 "*|\
            "✅ "*|"🔖 "*|"🎉 "*|"📄 "*|"🙈 "*) ;;
            *) fail 'The title must start with a supported Gitmoji followed by a space.' ;;
          esac

          if [[ "$TITLE" =~ [[:cntrl:]] ]]; then
            fail 'The title must be a single line without control characters.'
          fi

          if [[ "$TITLE" == *"  "* || "$TITLE" == *" " ]]; then
            fail 'Do not use consecutive or trailing spaces.'
          fi

          rest=${TITLE#* }

          if [[ ! "$rest" =~ ^[A-Z] ]]; then
            fail 'The sentence after the emoji must start with a capital letter.'
          fi

          if [[ "$TITLE" == *. ]]; then
            fail 'The title must not end with a period.'
          fi

          echo 'Title format is valid.'
