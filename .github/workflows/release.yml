name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and source
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Only stable v0.x.y and v1.x.y tags are supported.'
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'Release commit must be reachable from main.'
            exit 1
          fi

          if ! grep -qx 'module github.com/hainuoli/mino' go.mod; then
            echo 'Fix the public Go module path before publishing.'
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  minimum-go:
    name: Minimum Go / 1.23
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

  publish:
    name: Publish Release
    needs: [verify, minimum-go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          heading="## ${version}"

          # The section runs from its heading to the next level-two heading.
          awk -v heading="$heading" '
            $0 == heading || index($0, heading " (") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside && !started && /^[[:space:]]*$/ { next }
            inside { started = 1; print }
          ' docs/release-notes.md > "$RUNNER_TEMP/notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::docs/release-notes.md has no section for ${version}."
            echo "Cut the Latest Changes section into '## ${version} (YYYY-MM-DD)' before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
