# Latest Changes classifies paths; maintainers classify source changes.
commit-title: "📝 Update release notes"
auto-labels:
  docs:
    - CHANGELOG.md
    - README*.md
    - CONTRIBUTING.md
    - SECURITY.md
  upgrade:
    - go.mod
    - go.sum
  internal:
    - .github/**
    - .gitignore
    - .gitattributes
