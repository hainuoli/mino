# Existing categories take precedence; otherwise classify titles, then paths.
commit-title: "📝 Update release notes"
label-from-title: true
auto-labels:
  docs:
    - CHANGELOG.md
    - README*.md
    - CONTRIBUTING.md
    - SECURITY.md
  upgrade:
    - go.mod
    - go.sum
  internal:
    - .github/**
    - .gitignore
    - .gitattributes
